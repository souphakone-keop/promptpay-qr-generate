<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptPay Payment</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <header class="header">
            <div class="brand">
                <img
                    src="https://upload.wikimedia.org/wikipedia/commons/c/c5/PromptPay-logo.png?utm_source=th.wikipedia.org&utm_campaign=index&utm_content=original"
                    alt="PromptPay Logo"
                    class="logo"
                >
                <span>PromptPay</span>
        </div>    
            <p>QR Payment Generator</p>
        </header>

        <section class="card">
            <h1>Create a payment QR</h1>
            <p class="description">
                Enter an amount to generate your PromptPay QR code.
            </p>

            <form id="qrForm">
                <label for="amount">Amount (THB)</label>

                <div class="amount-input">
                    <span>฿</span>
                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        placeholder="0.00"
                        min="0.01"
                        max="999999999.99"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit" id="generateBtn">
                    Generate QR Code
                </button>
            </form>

            <p class="message" id="message" role="alert"></p>

            <section class="qr-section" id="qrSection">
                <div class="divider"></div>

                <h2>Scan to pay</h2>
                <p class="qr-description">
                    Scan this code using your mobile banking app.
                </p>

                <div class="qr-frame">
                    <img id="qrImage" src="" alt="PromptPay QR Code">
                </div>

                <div class="payment-amount">
                    <span>Total amount</span>
                    <strong>
                        ฿<span id="amountDisplay">0.00</span>
                    </strong>
                </div>

                <button type="button" class="download-btn" id="downloadBtn">
                    Download QR Code
                </button>
            </section>
        </section>

        <footer>
            PromptPay QR Payment
        </footer>

    </main>

    <script>
        const qrForm = document.getElementById('qrForm')
        const amountInput = document.getElementById('amount')
        const generateBtn = document.getElementById('generateBtn')
        const qrSection = document.getElementById('qrSection')
        const qrImage = document.getElementById('qrImage')
        const amountDisplay = document.getElementById('amountDisplay')
        const message = document.getElementById('message')
        const downloadBtn = document.getElementById('downloadBtn')

        let currentAmount = 0

        function showMessage(text) {
            message.textContent = text
            message.style.display = 'block'
        }

        function hideMessage() {
            message.textContent = ''
            message.style.display = 'none'
        }

        qrForm.addEventListener('submit', async (e) => {
            e.preventDefault()

            const amount = Number(amountInput.value)

            if (
                !Number.isFinite(amount) ||
                amount <= 0 ||
                amount > 999999999.99
            ) {
                showMessage('Please enter a valid payment amount.')
                return
            }

            if (Math.round(amount * 100) !== amount * 100) {
                showMessage('Please enter no more than 2 decimal places.')
                return
            }

            generateBtn.disabled = true
            generateBtn.textContent = 'Generating...'
            hideMessage()
            qrSection.classList.remove('show')

            try {
                const response = await fetch(
                    'http://localhost:3000/generateQR',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ amount })
                    }
                )

                const data = await response.json()

                if (!response.ok || data.Rescode !== 200) {
                    throw new Error(
                        data.resMessage || 'Failed to generate QR code.'
                    )
                }

                if (!data.result) {
                    throw new Error('The server did not return a QR code.')
                }

                qrImage.src = data.result

                amountDisplay.textContent = amount.toLocaleString('en-US', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                })

                currentAmount = amount
                qrSection.classList.add('show')

                qrSection.scrollIntoView({
                    behavior: 'smooth',
                    block: 'nearest'
                })

            } catch (error) {
                showMessage(error.message || 'Cannot connect to the server.')
            } finally {
                generateBtn.disabled = false
                generateBtn.textContent = 'Generate QR Code'
            }
        })

        downloadBtn.addEventListener('click', async () => {
            if (!qrImage.src || !currentAmount) {
                showMessage('Please generate a QR code first.')
                return
            }

            try {
                const response = await fetch(qrImage.src)

                if (!response.ok) {
                    throw new Error('Download failed.')
                }

                const blob = await response.blob()
                const objectURL = URL.createObjectURL(blob)
                const link = document.createElement('a')

                link.href = objectURL
                link.download = `promptpay-${currentAmount.toFixed(2)}.png`

                document.body.appendChild(link)
                link.click()
                link.remove()

                setTimeout(() => URL.revokeObjectURL(objectURL), 1000)

            } catch {
                const link = document.createElement('a')

                link.href = qrImage.src
                link.target = '_blank'
                link.rel = 'noopener noreferrer'
                link.click()
            }
        })
    </script>
</body>
</html>
